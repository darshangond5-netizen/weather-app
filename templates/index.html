<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>3D Atmosphere - Weather Experience</title>
</head>
<body data-theme="{{ weather.condition|lower if weather else 'default' }}">

    <!-- Interactive Canvas & Animated Atmosphere -->
    <div class="sky-background">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
        <canvas id="weatherCanvas"></canvas>
    </div>

    <!-- Main Dynamic 3D Card Container -->
    <div class="scene">
        <main class="container 3d-card" id="tiltCard">
            <header>
                <h1 class="logo">🌤️ Atmosphere</h1>
            </header>

            <form method="POST" class="search-box">
                <div class="input-wrapper">
                    <input 
                        type="text" 
                        name="city" 
                        placeholder="Search city..." 
                        required 
                        autocomplete="off"
                    >
                    <button type="submit" aria-label="Search">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                    </button>
                </div>
            </form>

            {% if error %}
                <div class="error-badge">
                    <span>⚠️ {{ error }}</span>
                </div>
            {% endif %}

            {% if weather %}
                <section class="weather-card">
                    <div class="location-tag">
                        <span>📍 {{ weather.city }}, {{ weather.country }}</span>
                    </div>

                    <!-- Interactive 3D Visualizer -->
                    <div class="visualizer-container">
                        <div class="weather-3d-visual" id="visual3D">
                            <!-- Dynamic SVG icon with floating animation -->
                            <img class="weather-icon-3d" 
                                 src="https://openweathermap.org/img/wn/{{ weather.icon }}@4x.png" 
                                 alt="{{ weather.condition }}">
                        </div>
                    </div>

                    <div class="temp-display">
                        <span class="temp-value">{{ weather.temperature }}</span>
                        <span class="temp-unit">°C</span>
                    </div>

                    <p class="condition-text">{{ weather.condition }}</p>

                    <div class="details-grid">
                        <div class="detail-card">
                            <span class="detail-label">💧 Humidity</span>
                            <strong class="detail-value">{{ weather.humidity }}%</strong>
                        </div>
                        <div class="detail-card">
                            <span class="detail-label">🌡️ Feels Like</span>
                            <strong class="detail-value">{{ weather.feels_like }}°C</strong>
                        </div>
                        <div class="detail-card">
                            <span class="detail-label">💨 Wind Speed</span>
                            <strong class="detail-value">{{ weather.wind }} <small>km/h</small></strong>
                        </div>
                    </div>
                </section>
            {% endif %}
        </main>
    </div>

    <script>
        // --- 1. 3D Tilt & Cursor Tracking Logic ---
        const card = document.getElementById('tiltCard');
        const visual3D = document.getElementById('visual3D');
        
        if (card) {
            document.addEventListener('mousemove', (e) => {
                const xAxis = (window.innerWidth / 2 - e.pageX) / 25;
                const yAxis = (window.innerHeight / 2 - e.pageY) / 25;
                
                card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
                if(visual3D) {
                    visual3D.style.transform = `translateZ(60px) rotateY(${xAxis * 1.5}deg)`;
                }
            });

            // Smooth Reset when mouse leaves window
            document.addEventListener('mouseleave', () => {
                card.style.transform = `rotateY(0deg) rotateX(0deg)`;
                if(visual3D) {
                    visual3D.style.transform = `translateZ(40px) rotateY(0deg)`;
                }
            });
        }

        // --- 2. Dynamic Weather Particle System Canvas ---
        const canvas = document.getElementById('weatherCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const currentCondition = "{{ weather.condition|lower if weather else 'default' }}";

        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 3 + 1;
                this.speedY = currentCondition.includes('rain') ? Math.random() * 7 + 4 : Math.random() * 1.5 + 0.5;
                this.speedX = Math.random() * 1 - 0.5;
                this.opacity = Math.random() * 0.5 + 0.2;
            }

            update() {
                this.y += this.speedY;
                this.x += this.speedX;

                if (this.y > canvas.height) {
                    this.y = -10;
                    this.x = Math.random() * canvas.width;
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = currentCondition.includes('rain') ? `rgba(147, 197, 253, ${this.opacity})` : `rgba(255, 255, 255, ${this.opacity})`;
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            const count = currentCondition.includes('rain') ? 120 : 50;
            for (let i = 0; i < count; i++) {
                particles.push(new Particle());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }

        initParticles();
        animate();
    </script>
</body>
</html>
